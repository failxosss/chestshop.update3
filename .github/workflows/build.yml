name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v4

      - name: Nastavit JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Sestavit plugin
        run: mvn -B package

      - name: Nahrat vysledny jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpleShop
          path: target/*.jar
